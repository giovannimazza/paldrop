<!doctype html>
<html lang="it" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1e" />
    <meta
      name="description"
      content="Paldrop: trasferisci foto da un telefono all'altro con un QR code. Nessun numero, nessun account, nessun contatto."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Paldrop" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath fill='%236366f1' fill-rule='evenodd' d='M13 5h13a13 13 0 0 1 0 26h-7v12h-6z M27 10.5c0 0 5.5 6.5 5.5 10a5.5 5.5 0 1 1-11 0C21.5 17 27 10.5 27 10.5z'/%3E%3C/svg%3E"
    />
    <title>Paldrop</title>
    <script>
      // Apply stored theme/language before first paint (dark is the default).
      try {
        var theme = localStorage.getItem("paldrop.theme");
        document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
        var lang = localStorage.getItem("paldrop.lang");
        if (lang === "en" || lang === "it") {
          document.documentElement.lang = lang;
        } else if ((navigator.language || "").toLowerCase().indexOf("en") === 0) {
          document.documentElement.lang = "en";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
