# One-shot helper: refreshes package-lock.json from the registry and commits it.
# Run it when package.json gained a dependency that could not be installed
# locally. Delete this workflow once the lock is back in sync.
name: Sync lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install (updates the lock, not the tree)
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Verify npm ci now resolves
        run: npm ci
      - name: Commit the refreshed lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lock already in sync; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh package-lock.json from the registry"
          git push origin HEAD:${{ github.ref_name }}
